<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotoğraf Yükleme Paneli</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        button { 
            margin-top: 15px; 
            padding: 10px 20px; 
            cursor: pointer; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px;
        }
        button:hover { background: #218838; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; }
        input[type="file"] { margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Fotoğrafları Gönder3</h2>
        <p>Lütfen yüklemek istediğiniz fotoğrafları seçin.</p>
        <input type="file" id="fileInput" accept="image/*" multiple>
        <br>
        <button id="uploadBtn" onclick="uploadFiles()">Drive'a Yükle</button>
        <p id="status"></p>
    </div>

    <script>
        function uploadSingleFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        
                        // BOYUT OPTİMİZASYONU: 1000 yerine 800px
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // KALİTE OPTİMİZASYONU: 0.8 yerine 0.7
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        const base64Data = dataUrl.split(',')[1];

                        const data = {
                            name: file.name,
                            type: 'image/jpeg',
                            base64: base64Data
                        };

                        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgV8bB40dNjzcJznif2Zci_IYxgNSyzAGyLhG76NmkwDGOG8I6B3DXjxBTXS8yxD1J/exec';

                        fetch(scriptURL, {
                            method: 'POST',
                            body: JSON.stringify(data),
                            mode: 'no-cors' 
                        })
                        .then(() => resolve())
                        .catch((err) => reject(err));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (files.length === 0) {
                status.innerText = "Lütfen en az bir fotoğraf seçin.";
                status.style.color = "red";
                return;
            }

            btn.disabled = true;
            status.style.color = "#007bff";
            
            let successCount = 0;
            status.innerText = `Yükleniyor... (0/${files.length})`;

            try {
                // PARALEL İŞLEM MİMARİSİ
                const uploadPromises = Array.from(files).map(file => {
                    return uploadSingleFile(file).then(() => {
                        successCount++;
                        // Ekranda sayacı anlık olarak güncelle
                        status.innerText = `Yükleniyor... (${successCount}/${files.length})`;
                    });
                });

                // Promise.all ile tüm dosyaları aynı anda ağa gönder
                await Promise.all(uploadPromises);

                status.innerText = `Harika! ${successCount} fotoğraf çok hızlı bir şekilde Drive'a gönderildi.`;
                status.style.color = "green";
                fileInput.value = ""; 
            } catch (error) {
                status.innerText = "Yükleme sırasında bir hata oluştu. Lütfen tekrar deneyin.";
                status.style.color = "red";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
