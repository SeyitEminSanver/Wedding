<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aşk Anılarımız | Ortak Köşemiz</title>
    <style>
        /* TÜM SAYFA AYARLARI */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* ARKA PLAN FOTOĞRAFI: Sadece dosya adını yazdık */
            background-image: url('image_4.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }

        /* ARKA PLAN KARARTMA (Overlay) */
        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* Hafif karartma, metinlerin okunması için */
            z-index: 1;
        }

        /* ANA KONTEYNER */
        .container {
            background-color: rgba(255, 255, 255, 0.95); /* Şeffaf beyaz */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 90%;
            text-align: center;
            z-index: 2; /* Arka plan karartmasının üstünde olması için */
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px); /* Hafif yükselme efekti */
        }

        /* BAŞLIK VE METİNLER */
        h2 {
            color: #d63384; /* Romantik pembe */
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p.welcome {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
            font-style: italic;
        }

        /* ÖZEL DOSYA SEÇME BUTONU */
        .custom-file-upload {
            border: 2px solid #d63384;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
            color: #d63384;
            display: inline-block;
            margin-bottom: 20px;
            background-color: transparent;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #d63384;
            color: white;
        }

        /* Varsayılan dosya inputunu gizliyoruz */
        input[type="file"] {
            display: none;
        }

        /* UPLOAD BUTONU VE SAYAÇ */
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button#uploadBtn { 
            padding: 15px 30px; 
            cursor: pointer; 
            background: #d63384; /* Romantik pembe */
            color: white; 
            border: none; 
            border-radius: 50px; /* Yuvarlak buton */
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button#uploadBtn:hover { 
            background: #b52a6e; 
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.5);
            transform: scale(1.03); /* Hafif büyüme */
        }

        button#uploadBtn:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        #status { margin-top: 25px; font-weight: bold; font-size: 16px; min-height: 20px; }
        
        /* Mobil Cihazlar İçin Uyumluluk */
        @media (max-width: 600px) {
            h2 { font-size: 26px; }
            p.welcome { font-size: 16px; }
            .container { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Aşk Anılarımız</h2>
        <p class="welcome">Her an değerli, her an bizim... En sevdiğimiz fotoğrafları buradan ekleyebiliriz.</p>
        
        <div class="btn-group">
            <!-- Özel dosya seçme etiketi -->
            <label for="fileInput" class="custom-file-upload">
                <i class="fa fa-cloud-upload"></i> Fotoğraf Seç
            </label>
            <!-- Varsayılan dosya inputunu gizledik -->
            <input type="file" id="fileInput" accept="image/*" multiple>
            
            <button id="uploadBtn" onclick="uploadFiles()">Hemen Paylaş! ❤️</button>
        </div>
        
        <p id="status"></p>
    </div>

    <script>
        function uploadSingleFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        
                        const MAX_WIDTH = 1920;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                        const base64Data = dataUrl.split(',')[1];

                        const data = {
                            name: file.name,
                            type: 'image/jpeg',
                            base64: base64Data
                        };

                        // KENDİ URL'N
                        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgV8bB40dNjzcJznif2Zci_IYxgNSyzAGyLhG76NmkwDGOG8I6B3DXjxBTXS8yxD1J/exec';

                        fetch(scriptURL, {
                            method: 'POST',
                            body: JSON.stringify(data),
                            mode: 'no-cors' 
                        })
                        .then(() => resolve())
                        .catch((err) => reject(err));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (files.length === 0) {
                status.innerText = "Lütfen önce en az bir fotoğraf seçin.";
                status.style.color = "red";
                return;
            }

            btn.disabled = true;
            status.style.color = "#007bff";
            
            let successCount = 0;
            status.innerText = `Anılar paylaşılıyor... (0/${files.length})`;

            try {
                // Asenkron (Paralel) yükleme yapısı korundu
                const uploadPromises = Array.from(files).map(file => {
                    return uploadSingleFile(file).then(() => {
                        successCount++;
                        status.innerText = `Anılar paylaşılıyor... (${successCount}/${files.length})`;
                    });
                });

                // Tüm dosyaları aynı anda ağa gönderir
                await Promise.all(uploadPromises);

                status.innerText = `Harika! ${successCount} anı yüksek kaliteyle Drive'a paylaşıldı. ✨`;
                status.style.color = "green";
                fileInput.value = ""; 
            } catch (error) {
                status.innerText = "Anılar paylaşılırken bir hata oluştu. Lütfen tekrar deneyin.";
                status.style.color = "red";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
